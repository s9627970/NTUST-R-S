<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 守護校貓計畫 | 拍立得抽獎與周邊認購</title>
    
    <link rel="icon" href="icon/icon.jpg" type="image/jpeg">
    
    <style>
        :root {
            --primary-peach: #ffb7b2;
            --secondary-cream: #fff4e6;
            --accent-brown: #6d4c41;
            --soft-white: #ffffff;
            --success-green: #a5d6a7;
            --progress-bg: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
            background-color: #fffaf5;
            color: var(--accent-brown);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            background-color: var(--soft-white);
            padding: 50px 20px;
            text-align: center;
            border-bottom: 6px dashed var(--primary-peach);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #d88a8a;
        }

        /* --- 募資進度條樣式 --- */
        .funding-container {
            max-width: 600px;
            margin: 25px auto 0 auto;
            padding: 0 20px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 24px;
            background-color: var(--progress-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%; /* 初始為 0，由 JS 控制 */
            background: linear-gradient(90deg, #ffb7b2, #ff9a93);
            border-radius: 12px;
            transition: width 1.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .progress-percent {
            color: white;
            font-size: 0.8rem;
            margin-right: 10px;
            font-weight: bold;
        }

        /* --- 原有樣式 --- */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .lottery-box {
            background: var(--soft-white);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 60px;
        }

        .polaroid-frame {
            width: 240px;
            height: 300px;
            background: white;
            margin: 20px auto;
            padding: 15px 15px 50px 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
        }

        .polaroid-frame img {
            width: 100%; height: 100%; object-fit: cover; display: none;
        }

        .placeholder-text { font-size: 4rem; color: var(--secondary-cream); }

        .shaking { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: rotate(-2deg) translate(2px, 2px); }
            50% { transform: rotate(2deg) translate(-2px, -2px); }
            100% { transform: rotate(-2deg) translate(2px, 2px); }
        }

        .btn {
            background-color: var(--primary-peach);
            color: white; border: none; padding: 15px 40px;
            border-radius: 50px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }

        #order-form {
            max-width: 500px; margin: 30px auto 0 auto; text-align: left;
            display: none; background: var(--secondary-cream); padding: 30px; border-radius: 20px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid white; border-radius: 10px; box-sizing: border-box; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .item-card { background: white; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.03); text-align: center; padding-bottom: 25px; transition: 0.3s; }
        .item-card img { width: 100%; height: 250px; object-fit: cover; }
        .price { color: #e57373; font-size: 1.3rem; font-weight: bold; }

        footer { text-align: center; padding: 60px 20px; background: #fff; margin-top: 60px; font-size: 0.9rem; color: #999; }
    </style>
</head>
<body>

<header>
    <h1>🐾 台科大校貓校狗守護計畫</h1>
    <p>溫暖每一個小生命，您的支持是我們最大的動力。</p>

    <div class="funding-container">
        <div class="progress-labels">
            <span>目前募得：$<span id="current-amount">0</span></span>
            <span>目標：$<span id="target-amount">75,000</span></span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill">
                <span class="progress-percent" id="progress-percent">0%</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    
    <section class="lottery-box">
        <h2 class="section-title">限量拍立得隨機抽🐾</h2>
        <div class="polaroid-frame" id="polaroid-frame">
            <span class="placeholder-text" id="placeholder">?</span>
            <img id="result-img" src="" alt="抽獎結果">
        </div>
        <button class="btn" id="draw-btn" onclick="executeDraw()">立即抽取拍立得</button>

        <div id="order-form">
            <h3 style="text-align:center;">✨ 抽到了！請填寫寄送資訊</h3>
            <div class="form-group"><label>收件人姓名</label><input type="text" id="name"></div>
            <div class="form-group"><label>聯絡電話</label><input type="tel" id="phone"></div>
            <div class="form-group"><label>收件地址</label><input type="text" id="address"></div>
            <button class="btn" style="width:100%; background-color: var(--success-green);" onclick="submitOrder()">確認送出並付款</button>
        </div>
    </section>

    <section>
        <h2 class="section-title">校貓暖心周邊🐾</h2>
        <div class="shop-grid">
            <div class="item-card">
                <img src="image/item_1.jpg" alt="周邊 1">
                <div class="item-info"><h3>校貓吊飾</h3><p class="price">$350</p><button class="btn" style="font-size: 0.9rem; padding: 10px 20px;">加入購物車</button></div>
            </div>
            <div class="item-card">
                <img src="image/item_2.jpg" alt="周邊 2">
                <div class="item-info"><h3>校貓T恤</h3><p class="price">$120</p><button class="btn" style="font-size: 0.9rem; padding: 10px 20px;">加入購物車</button></div>
            </div>
            <div class="item-card">
                <img src="image/item_3.jpg" alt="周邊 3">
                <div class="item-info"><h3>校貓徽章</h3><p class="price">$180</p><button class="btn" style="font-size: 0.9rem; padding: 10px 20px;">加入購物車</button></div>
            </div>
        </div>
    </section>
</div>

<footer>
    <p>© 2026 台科根與芽動保社 NTUST Roots&Shoots</p>
    <p>所有收入將用於校貓校狗之醫療、罐頭及環境維護費用。</p>
</footer>

<script>
    // --- 讀取進度條資料 ---
    async function updateProgressBar() {
        const targetAmount = 50000; // 你可以在這裡修改目標金額
        document.getElementById('target-amount').innerText = targetAmount.toLocaleString();

        try {
            // 從 file/Already_Funds_Raised.txt 讀取
            const response = await fetch('file/Already_Funds_Raised.txt');
            if (!response.ok) throw new Error('無法讀取檔案');
            
            const data = await response.text();
            const currentAmount = parseInt(data.trim()) || 0;

            // 計算百分比
            let percent = (currentAmount / targetAmount) * 100;
            if (percent > 100) percent = 100; // 最高 100%

            // 更新 UI
            document.getElementById('current-amount').innerText = currentAmount.toLocaleString();
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-percent').innerText = Math.floor(percent) + '%';

        } catch (error) {
            console.error("讀取募資金額失敗:", error);
            document.getElementById('current-amount').innerText = "讀取中...";
        }
    }

    // 初始化讀取
    window.onload = updateProgressBar;

    // --- 抽獎邏輯 ---
    function executeDraw() {
        const frame = document.getElementById('polaroid-frame');
        const placeholder = document.getElementById('placeholder');
        const resultImg = document.getElementById('result-img');
        const drawBtn = document.getElementById('draw-btn');
        const orderForm = document.getElementById('order-form');

        drawBtn.disabled = true;
        drawBtn.innerText = "抽取中...";
        placeholder.innerText = "⏳";
        frame.classList.add('shaking');
        orderForm.style.display = "none";
        resultImg.style.display = "none";

        const randomNum = Math.floor(Math.random() * 4) + 1;
        const resultPath = `image/cat_${randomNum}.jpg`;

        setTimeout(() => {
            frame.classList.remove('shaking');
            placeholder.style.display = "none";
            resultImg.src = resultPath;
            resultImg.style.display = "block";
            frame.style.transform = "rotate(0deg) scale(1.1)";
            drawBtn.innerText = "再抽一次";
            drawBtn.disabled = false;
            orderForm.style.display = "block";
            setTimeout(() => { orderForm.scrollIntoView({ behavior: 'smooth' }); }, 100);
        }, 1500);
    }

    function submitOrder() {
        const name = document.getElementById('name').value;
        if(!name) { alert("請填寫收件資訊喔！"); return; }
        alert("訂單已預約！感謝支持！");
    }
</script>

</body>
</html>
